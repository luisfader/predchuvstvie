<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Предчувствие — Роберт Фадер</title>
<meta name="description" content="«Предчувствие» Роберта Фадера: все сезоны романа и саундтрек">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141210; --panel:#1d1915; --line:#3a2f25; --text:#e9dfd0; --muted:#a8998a;
  --accent:#d9893b; --accent2:#4f8a8b; --glow:rgba(217,137,59,.18); --fs:18px;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-anchor:none}
body{background:var(--bg) radial-gradient(ellipse at 20% -10%,#2b2017 0,transparent 60%) fixed;color:var(--text);
  font:var(--fs)/1.75 "PT Serif",Georgia,serif;padding-bottom:96px}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(20,18,16,.92);backdrop-filter:blur(6px);z-index:5}
header h1{font:700 24px/1 "Cormorant Garamond",serif;margin:0;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
header .sp{flex:1}
button{font:inherit;font-size:15px;line-height:1.3;background:var(--panel);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.main{background:var(--accent);color:#1a120a;border-color:var(--accent);font-weight:700}
main{max-width:760px;margin:0 auto;padding:24px 16px}
.crumb{font-size:14px;color:var(--muted);margin:0 0 14px}
.crumb a{color:var(--muted)}
/* сага */
.saga{text-align:center;padding:12px 0 8px}
.saga .kick{color:var(--accent);letter-spacing:.35em;font-size:13px;text-transform:uppercase}
.saga h2{font:700 56px/1 "Cormorant Garamond",serif;margin:8px 0 6px}
.saga p{color:var(--muted);max-width:560px;margin:10px auto}
.saga .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;margin:32px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.card .b{padding:10px 12px 14px}
.card .s{color:var(--accent);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.card h3{font:700 22px/1.15 "Cormorant Garamond",serif;margin:2px 0 4px}
.card .m{color:var(--muted);font-size:14px}
.card .bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent)}
/* часть */
.hero{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.hero img{width:100%;border-radius:10px;box-shadow:0 10px 40px #000a}
.hero h2{font:700 40px/1.1 "Cormorant Garamond",serif;margin:0 0 6px}
.meta{color:var(--muted);font-size:15px}
.desc{white-space:pre-line}
ol.toc{list-style:none;padding:0;margin:28px 0 0}
ol.toc li{border-top:1px solid var(--line)}
ol.toc a{display:flex;gap:14px;padding:10px 4px;text-decoration:none;color:var(--text)}
ol.toc .n{color:var(--accent);font-variant-numeric:tabular-nums;min-width:2.2ch}
ol.toc a:hover{background:var(--glow)}
ol.toc a.read .t{color:var(--muted)}
ol.toc .note{margin-left:auto;color:var(--accent2);font-size:14px;white-space:nowrap}
/* глава */
article h2.ch{font:700 34px/1.15 "Cormorant Garamond",serif;margin:8px 0 24px;text-align:center}
article .num{display:block;text-align:center;color:var(--accent);letter-spacing:.3em;font-size:13px;text-transform:uppercase}
article h3{font:700 26px/1.2 "Cormorant Garamond",serif;margin:32px 0 10px}
article h4{font-size:1em;margin:24px 0 8px}
article img{display:block;max-width:100%;margin:28px auto;border-radius:10px;box-shadow:0 12px 40px #000b}
article em{color:#f0d9b5}
article hr{border:0;text-align:center;margin:28px 0}
article hr:after{content:"✦ ✦ ✦";color:var(--accent)}
article blockquote{margin:16px 0;padding:4px 16px;border-left:3px solid var(--accent);color:#f0d9b5}
article ul,article ol{padding-left:1.4em}
.nav{display:flex;justify-content:space-between;gap:12px;margin:40px 0 0}
.nav button{max-width:48%;text-align:left}
.nav button.r{text-align:right;margin-left:auto}
.nav small{display:block;color:var(--muted);font-size:12px}
/* плеер */
.player{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(29,25,21,.97);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:10px 16px}
.player .t{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.player .t b{color:var(--text);font-weight:700}
.player audio{display:none}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.tag.song{background:var(--accent);color:#1a120a}
.tag.inst{border:1px solid var(--line);color:var(--muted)}
.sheet{position:fixed;inset:auto 0 58px 0;max-height:70vh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);
  z-index:7;padding:12px 16px 16px;display:none;box-shadow:0 -20px 40px #0008}
.sheet.on{display:block}
.sheet h3{font:700 24px/1 "Cormorant Garamond",serif;margin:4px 0 10px}
.sheet .tr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer}
.sheet .tr:hover,.sheet .tr.cur{background:var(--glow)}
.sheet .tr .x{flex:1;min-width:0}
.sheet .tr small{display:block;color:var(--muted);font-size:13px}
@media (max-width:600px){
  :root{--fs:17px}
  header h1{font-size:21px}
  .saga h2{font-size:44px}
  .parts{grid-template-columns:repeat(2,1fr);gap:12px}
  .card h3{font-size:19px}
  .hero{grid-template-columns:1fr}
  .hero img{max-width:220px;margin:0 auto}
  .hero h2{font-size:32px;text-align:center}
}
</style>
</head>
<body>
<header>
  <h1 onclick="go('')">Предчувствие</h1>
  <span class="sp"></span>
  <button onclick="fsz(-1)" aria-label="Мельче">A−</button>
  <button onclick="fsz(1)" aria-label="Крупнее">A+</button>
  <button onclick="go('')">Части</button>
</header>
<main id="app"></main>
<div class="sheet" id="sheet"></div>
<div class="player empty" id="player">
  <span class="t" id="ptitle" onclick="sheetToggle()">♪ Саундтрек</span>
  <button id="listT" onclick="sheetToggle()" aria-label="Список треков">☰</button>
  <button id="prevT" aria-label="Предыдущий трек">⏮</button>
  <button id="play" aria-label="Играть">▶</button>
  <button id="nextT" aria-label="Следующий трек">⏭</button>
  <audio id="audio" preload="none"></audio>
</div>
<script>
history.scrollRestoration='manual';
const app=document.getElementById('app');
let saga,tracks=[],cur=-1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const go=h=>{location.hash=h?'#/'+h:''};
function toTop(){let touched=false;const s=()=>{if(!touched)scrollTo(0,0)};
  addEventListener('touchstart',()=>touched=true,{once:true,passive:true});
  s();requestAnimationFrame(s);[60,200,450].forEach(t=>setTimeout(s,t))}
function fsz(d){let v=Math.min(24,Math.max(14,store.get('pred-fs',matchMedia('(max-width:600px)').matches?17:18)+d));
  store.set('pred-fs',v);document.documentElement.style.setProperty('--fs',v+'px')}
(()=>{const v=store.get('pred-fs',null);if(v)document.documentElement.style.setProperty('--fs',v+'px')})();

/* markdown */
function inline(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function mdToHtml(md,title){
  md=md.replace(/\r/g,'').replace(/^\s*#\s+[^\n]*\n/,'');
  return md.split(/\n\s*\n/).map(b=>{b=b.trim(); if(!b) return '';
    let m;
    if(/^(\*\s*){3,}$|^-{3,}$/.test(b)) return '<hr>';
    if(m=b.match(/^!\[([^\]]*)\]\(([^)]+)\)$/)) return `<img src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy">`;
    if(m=b.match(/^(#{1,4})\s+(.*)$/)) return m[1].length<=2?`<h3>${inline(m[2])}</h3>`:`<h4>${inline(m[2])}</h4>`;
    const L=b.split('\n');
    if(L.every(l=>/^[-•]\s+/.test(l))) return '<ul>'+L.map(l=>'<li>'+inline(l.replace(/^[-•]\s+/,''))+'</li>').join('')+'</ul>';
    if(L.every(l=>/^>\s?/.test(l))) return '<blockquote>'+L.map(l=>inline(l.replace(/^>\s?/,''))).join('<br>')+'</blockquote>';
    return '<p>'+L.map(inline).join('<br>')+'</p>';
  }).join('\n');
}

/* данные */
async function init(){
  saga=await (await fetch('saga.json')).json();
  try{tracks=(await (await fetch('audio/tracks.json')).json()).tracks||[]}catch(e){tracks=[]}
  setupPlayer(); route(); addEventListener('hashchange',route);
}
const part=id=>saga.parts.find(p=>p.id===id);
function chapNo(p,i){if(p.chapters[i].label) return p.chapters[i].label;
  let n=0;for(let k=0;k<=i;k++) if(!p.chapters[k].label) n++; return 'Глава '+n}
function flat(){const a=[];saga.parts.forEach(p=>p.chapters.forEach((c,i)=>a.push({p,c,i})));return a}
const cid=c=>c.file.replace('.md','');
function readSet(){return new Set(store.get('pred-read',[]))}
function trackFor(pid,file){return tracks.findIndex(t=>t.part===pid&&(t.chapters||[]).includes(file))}

function home(){
  document.title='Предчувствие — Роберт Фадер';
  const last=store.get('pred-last2',null), rd=readSet();
  let lastTxt='';
  if(last){const [pid,ch]=last.split('/');const p=part(pid);const i=p?p.chapters.findIndex(c=>cid(c)===ch):-1;
    if(i>=0) lastTxt=`<button class="main" onclick="go('${last}')">Продолжить: ${esc(p.title)} · ${esc(chapNo(p,i))}</button>`}
  const total=saga.parts.reduce((s,p)=>s+p.chapters.length,0);
  app.innerHTML=`<section class="saga"><div class="kick">Роберт Фадер</div><h2>Предчувствие</h2>
    <p>После глобальной катастрофы мир лежит в руинах. Роберт строит «Нашу Утопию» — крепость, где выжившие пытаются жить без страха и жадности. Сезон за сезоном крепость выстаивает против дикарей, интриг Некрологии и стальных армий Главной Державы.</p>
    <div class="meta">${esc(saga.genre)} · ${esc(saga.rating)} · ${saga.parts.length} частей · ${total} глав</div>
    <div class="acts">${lastTxt}<button${lastTxt?'':' class="main"'} onclick="go('1/01')">Читать с начала</button>
    <button onclick="sheetToggle(true)">♪ Саундтрек</button></div></section>
    <div class="parts">${saga.parts.map(p=>{const r=p.chapters.filter(c=>rd.has(p.id+'/'+cid(c))).length;
      return `<div class="card" onclick="go('${p.id}')"><img src="${esc(p.cover)}" alt="${esc(p.title)}" loading="lazy">
      <div class="b"><div class="s">${esc(p.short)}</div><h3>${esc(p.title)}</h3>
      <div class="m">${p.chapters.length} глав${p.year?' · '+p.year:''}</div>
      ${r?`<div class="bar"><i style="width:${Math.round(100*r/p.chapters.length)}%"></i></div>`:''}</div></div>`}).join('')}</div>`;
  toTop();
}
function partPage(p){
  document.title=p.title+' — Предчувствие';
  const rd=readSet();
  app.innerHTML=`<p class="crumb"><a href="#">Предчувствие</a> › ${esc(p.short)}</p>
    <section class="hero"><img src="${esc(p.cover)}" alt="Обложка">
    <div><h2>${esc(p.title)}</h2>
    <div class="meta">${esc(saga.author)} · ${esc(saga.genre)} · ${esc(saga.rating)}${p.year?' · '+p.year:''}</div>
    <p class="desc">${esc(p.description)}</p>
    <button class="main" onclick="go('${p.id}/${cid(p.chapters[0])}')">Начать читать</button></div></section>
    <ol class="toc">${p.chapters.map((c,i)=>{const t=trackFor(p.id,c.file);
      const n=c.label?'✦':(chapNo(p,i).replace('Глава ',''));
      return `<li><a href="#/${p.id}/${cid(c)}" class="${rd.has(p.id+'/'+cid(c))?'read':''}"><span class="n">${n}</span><span class="t">${esc(c.label?c.label+': '+c.title:c.title)}</span>${t>=0?`<span class="note">♪ ${esc(tracks[t].title)}</span>`:''}</a></li>`}).join('')}</ol>`;
  toTop();
}
async function chapter(p,id){
  const i=p.chapters.findIndex(c=>cid(c)===id); if(i<0) return partPage(p);
  const c=p.chapters[i];
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
  const md=await (await fetch(`books/${p.id}/${c.file}`)).text();
  document.title=c.title+' — '+p.title;
  const all=flat(), k=all.findIndex(x=>x.p===p&&x.i===i), prev=all[k-1], next=all[k+1];
  const btn=(x,cls,arrow)=>{const sub=x.p!==p?x.p.title:chapNo(x.p,x.i);
    return `<button class="${cls}" onclick="go('${x.p.id}/${cid(x.c)}')"><small>${esc(sub)}</small>${arrow==='l'?'← ':''}${esc(x.c.title)}${arrow==='r'?' →':''}</button>`};
  app.innerHTML=`<p class="crumb"><a href="#">Предчувствие</a> › <a href="#/${p.id}">${esc(p.title)}</a></p>
   <article><span class="num">${esc(chapNo(p,i))}</span><h2 class="ch">${esc(c.title)}</h2>${mdToHtml(md)}</article>
   <div class="nav">${prev?btn(prev,'','l'):'<span></span>'}
   ${next?btn(next,'r','r'):`<button class="r" onclick="go('')">Конец саги · к частям</button>`}</div>`;
  toTop();
  const key=p.id+'/'+id; store.set('pred-last2',key);
  const rd=readSet(); rd.add(key); store.set('pred-read',[...rd]);
  const t=trackFor(p.id,c.file); if(t>=0 && t!==cur) load(t,!audio.paused);
}
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  let m;
  if(m=h.match(/^(\d{2})$/)) return go('2-2/'+m[1]);           // старые ссылки на 2.2
  if(m=h.match(/^([\d-]+)\/(\d+)$/)){const p=part(m[1]); if(p) return chapter(p,m[2])}
  if(m=h.match(/^([\d-]+)$/)){const p=part(m[1]); if(p) return partPage(p)}
  home();
}

/* плеер */
const audio=document.getElementById('audio'),pl=document.getElementById('player'),
      pt=document.getElementById('ptitle'),play=document.getElementById('play'),sheet=document.getElementById('sheet');
const tag=t=>t.song?'<span class="tag song">Песня</span>':'<span class="tag inst">Инструментал</span>';
function setupPlayer(){
  if(!tracks.length){pl.style.display='none';return}
  load(0,false);
  play.onclick=()=>audio.paused?audio.play():audio.pause();
  document.getElementById('nextT').onclick=()=>load((cur+1)%tracks.length,true);
  document.getElementById('prevT').onclick=()=>load((cur-1+tracks.length)%tracks.length,true);
  audio.onplay=()=>play.textContent='⏸'; audio.onpause=()=>play.textContent='▶';
  audio.onended=()=>load((cur+1)%tracks.length,true);
}
function load(i,autoplay){
  cur=i; const t=tracks[i]; audio.src='audio/'+t.file;
  pt.innerHTML='<b>♪ '+esc(t.title)+'</b>'+tag(t);
  if(sheet.classList.contains('on')) renderSheet();
  if(autoplay) audio.play().catch(()=>{});
}
function renderSheet(){
  sheet.innerHTML=`<h3>Саундтрек «Предчувствия»</h3>`+tracks.map((t,i)=>{
    const p=t.part&&part(t.part);
    const where=[p?p.title:'Вся сага',t.scene].filter(Boolean).join(' · ');
    return `<div class="tr${i===cur?' cur':''}" onclick="load(${i},true)"><span>${i===cur&&!audio.paused?'⏸':'▶'}</span>
      <div class="x"><b>${esc(t.title)}</b>${tag(t)}<small>${esc(where)}</small></div></div>`}).join('');
}
function sheetToggle(on){on=on??!sheet.classList.contains('on');sheet.classList.toggle('on',on);if(on)renderSheet()}
init();
</script>
</body>
</html>
